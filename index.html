<!doctype html>
<!--
  ================================================================
  JEU DE MÉMOIRE - IMAGES
  ================================================================
  - Conçu d'abord pour un ORDINATEUR, utilisable sur cellulaire.
  - Grilles rectangulaires (toujours un nombre pair de cartes) :
    2x2, 3x2, 4x3, 4x4, 5x4, 6x5, 6x6.
  - Les scores sont enregistrés dans une feuille Google (voir
    SCRIPT_URL plus bas). Si SCRIPT_URL est vide ou injoignable,
    le jeu garde les scores sur l'appareil et les envoie plus tard.
  ================================================================
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#082357">
<title>Mémoire</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23082357'/%3E%3Crect x='14' y='14' width='16' height='16' rx='4' fill='%23F5E72F'/%3E%3Crect x='34' y='14' width='16' height='16' rx='4' fill='%233DB0E2'/%3E%3Crect x='14' y='34' width='16' height='16' rx='4' fill='%233DB0E2'/%3E%3Crect x='34' y='34' width='16' height='16' rx='4' fill='%23F5E72F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Staatliches&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#082357;--yellow:#F5E72F;--blue:#197EA9;--sky:#3DB0E2;
  --bg:#f4f4f4;--card:#fff;--ink:#212121;--muted:#6b7280;--line:#e3e6ec;
  --ok:#2e9e5b;--ok-soft:#e3f6ea;--name:#fffbd6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Open Sans",Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
button{font:inherit;cursor:pointer}
.title{font-family:Staatliches,Impact,sans-serif;font-weight:400;letter-spacing:.5px}

/* En-tête */
header{background:var(--navy);color:#fff;position:relative;overflow:hidden}
header::before{content:"";position:absolute;right:-110px;top:-160px;width:380px;height:380px;border-radius:50%;background:var(--sky);opacity:.16}
.head{max-width:1320px;margin:0 auto;padding:16px 20px 14px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;position:relative;z-index:1}
.back{color:rgba(255,255,255,.75);text-decoration:none;font-size:13.5px;font-weight:600}
.back:hover{color:var(--yellow)}
h1{margin:0;font-size:34px;line-height:1}
h1 span{color:var(--yellow)}
.spacer{flex:1}
.player{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 6px 5px 14px;font-size:14px}
.player b{color:var(--yellow)}
.player button{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:999px;padding:4px 10px;font-size:12.5px}
.player button:hover{background:var(--yellow);color:var(--navy)}
.net{font-size:12px;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:6px}
.net i{width:8px;height:8px;border-radius:50%;background:#9aa2b1;display:inline-block}
.net.on i{background:#4ade80}.net.off i{background:#f59e0b}

/* Barre des niveaux */
.levels{max-width:1320px;margin:0 auto;padding:0 20px 16px;display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
.lvl{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#fff;border-radius:12px;padding:6px 12px;min-width:76px;text-align:center;line-height:1.15}
.lvl .g{font-family:Staatliches,Impact,sans-serif;font-size:20px;letter-spacing:.5px;display:block}
.lvl .s{font-size:11px;color:var(--yellow);letter-spacing:1px;display:block;min-height:13px}
.lvl:hover:not(:disabled){border-color:var(--yellow)}
.lvl.on{background:var(--yellow);color:var(--navy);border-color:var(--yellow)}
.lvl.on .s{color:var(--navy)}
.lvl:disabled{opacity:.38;cursor:not-allowed}

/* Zone de jeu */
.wrap{max-width:1320px;margin:0 auto;padding:16px 20px 30px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 14px;font-size:13px;color:var(--muted)}
.stat b{display:block;color:var(--navy);font-size:20px;font-family:Staatliches,Impact,sans-serif;letter-spacing:.5px;font-weight:400}
.btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.main{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.main:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.hint{color:var(--muted);font-size:13px}

.board{display:grid;gap:10px;justify-content:center;perspective:1200px;margin:0 auto}
.card{position:relative;border:0;padding:0;background:transparent;-webkit-tap-highlight-color:transparent}
.card:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:14px}
.inner{position:absolute;inset:0;transition:transform .42s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card.up .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cover{background:var(--navy);box-shadow:0 4px 12px rgba(8,35,87,.18);
  background-image:radial-gradient(circle at 20% 20%,rgba(61,176,226,.35) 0 18%,transparent 19%),radial-gradient(circle at 85% 80%,rgba(245,231,47,.25) 0 22%,transparent 23%)}
.cover span{font-family:Staatliches,Impact,sans-serif;color:var(--yellow);font-size:30px;opacity:.9}
.card:hover:not(.up) .cover{box-shadow:0 8px 18px rgba(8,35,87,.28);filter:brightness(1.12)}
.front{transform:rotateY(180deg);background:#e8eef7;border:2px solid var(--line);flex-direction:column;padding:8% 6% 4%;text-align:center;container-type:size}
.front .img{flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center}
.front .img svg{height:100%;max-width:100%;aspect-ratio:1;filter:drop-shadow(0 2px 2px rgba(8,35,87,.12))}
.front .lbl{font-size:clamp(8px,9.5cqh,15px);font-weight:700;color:var(--navy);line-height:1.2;margin-top:3%;white-space:nowrap}
.card.done .front{border-color:var(--ok);background:var(--ok-soft)}
.card.done .card.miss .front{border-color:#e05566;animation:shake .35s}
@keyframes shake{25%{transform:rotateY(180deg) translateX(-4px)}75%{transform:rotateY(180deg) translateX(4px)}}

/* Panneau des scores */
aside{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 6px 20px rgba(8,35,87,.06);position:sticky;top:12px}
aside h2{margin:0 0 10px;font-size:24px;color:var(--navy)}
.rec{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.rec div{background:var(--bg);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--muted)}
.rec b{display:block;font-family:Staatliches,Impact,sans-serif;font-weight:400;font-size:22px;color:var(--navy);letter-spacing:.4px}
.rec small{display:block;color:var(--blue);font-weight:700;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:4px 4px;border-bottom:1px solid var(--line)}
td{padding:6px 4px;border-bottom:1px solid #f0f2f6}
td.r,th.r{text-align:right}
tr.me td{background:#fffbd6}
.st{color:#e8b400;letter-spacing:1px}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.sub-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:14px 0 6px}

/* Fenêtres */
.modal{position:fixed;inset:0;background:rgba(8,35,87,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.show{display:flex}
.box{background:#fff;border-radius:22px;padding:24px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .3s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.box h3{margin:0 0 4px;font-size:34px;color:var(--navy)}
.stars{font-size:44px;letter-spacing:6px;margin:6px 0}
.stars .on{color:#f5c400}.stars .off{color:#dde1ea}
.res{display:flex;justify-content:center;gap:10px;margin:12px 0}
.res div{background:var(--bg);border-radius:12px;padding:8px 14px;font-size:12px;color:var(--muted)}
.res b{display:block;font-family:Staatliches,Impact,sans-serif;font-weight:400;font-size:24px;color:var(--navy)}
.badges{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px 0 4px;min-height:4px}
.badge{background:var(--yellow);color:var(--navy);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700}
.saved{font-size:13px;color:var(--muted);margin:8px 0 14px;min-height:18px}
.box input{width:100%;font:inherit;font-size:18px;border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0 4px;text-align:center}
.box input:focus{outline:none;border-color:var(--blue)}
.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}

@media (max-width:1100px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  aside{position:static}
}
@media (max-width:560px){
  h1{font-size:28px}
  .head,.levels,.wrap{padding-left:12px;padding-right:12px}
  .lvl{min-width:62px;padding:5px 8px}
  .board{gap:6px}
  .cover span{font-size:22px}
}
@media (prefers-reduced-motion:reduce){.inner{transition:none}.box{animation:none}}
</style>
</head>
<body>

<header>
  <div class="head">
    <div>
      <a class="back" id="backLink" href="#">← Mes outils</a>
      <h1 class="title">Mémoire <span>· Images</span></h1>
    </div>
    <div class="spacer"></div>
    <div class="net" id="net"><i></i><span>…</span></div>
    <div class="player">Joueur : <b id="pName">-</b><button id="pChange">Changer</button></div>
  </div>
  <div class="levels" id="levels"></div>
</header>

<div class="wrap">
  <main>
    <div class="bar">
      <div class="stat">Essais<b id="sTries">0</b></div>
      <div class="stat">Paires<b id="sPairs">0 / 0</b></div>
      <div class="stat">Temps<b id="sTime">0:00</b></div>
      <button class="btn main" id="bNew">Nouvelle partie</button>
      <span class="hint" id="hint">Trouve toutes les paires.</span>
    </div>
    <div class="board" id="board"></div>
  </main>

  <aside>
    <h2 class="title" id="lbTitle">Records</h2>
    <div class="rec">
      <div>Moins d'essais<b id="rTries">-</b><small id="rTriesWho"></small></div>
      <div>Meilleur temps<b id="rTime">-</b><small id="rTimeWho"></small></div>
    </div>
    <div class="sub-h">Top 5 du niveau</div>
    <div id="lbTable"></div>
    <div class="sub-h">Mes étoiles</div>
    <div class="empty" id="myStars">-</div>
  </aside>
</div>

<!-- Fin de partie -->
<div class="modal" id="mWin">
  <div class="box">
    <h3 class="title" id="wTitle">Bravo!</h3>
    <div class="stars" id="wStars"></div>
    <div class="res">
      <div>Essais<b id="wTries">0</b></div>
      <div>Temps<b id="wTime">0:00</b></div>
    </div>
    <div class="badges" id="wBadges"></div>
    <div id="wAsk" hidden>
      <div>Qui a joué?</div>
      <input id="wName" maxlength="20" placeholder="Ton prénom" autocomplete="off">
    </div>
    <div class="saved" id="wSaved"></div>
    <div class="acts">
      <button class="btn" id="wSave" hidden>Enregistrer</button>
      <button class="btn" id="wAgain">Rejouer</button>
      <button class="btn main" id="wNext">Niveau suivant →</button>
    </div>
  </div>
</div>

<!-- Changer de joueur -->
<div class="modal" id="mName">
  <div class="box">
    <h3 class="title">Qui joue?</h3>
    <input id="nName" maxlength="20" placeholder="Ton prénom" autocomplete="off">
    <div class="acts">
      <button class="btn" id="nCancel">Annuler</button>
      <button class="btn main" id="nOk">OK</button>
    </div>
  </div>
</div>

/* Étoiles : selon le nombre d'essais par rapport au nombre de paires */
function etoiles(essais, paires){
  if(essais <= Math.ceil(paires*1.5)) return 3;
  if(essais <= Math.ceil(paires*2.25)) return 2;
  return 1;
}

/* ============================================================ */
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
var LS={
  get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
$("backLink").href=RETOUR_URL;

/* ---------- Stockage des scores ---------- */
var rows=LS.get("mem_cache",[]);       // toutes les parties connues
var pending=LS.get("mem_pending",[]);  // parties pas encore envoyées
var online=false;

function setNet(state,txt){var n=$("net");n.className="net "+state;n.querySelector("span").textContent=txt;}
function api(method,body){
  var opt=method==="POST"?{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}:{};
  var url=SCRIPT_URL+(method==="GET"?(SCRIPT_URL.indexOf("?")<0?"?":"&")+"action=list&t="+Date.now():"");
  return fetch(url,opt).then(function(r){return r.json();}).then(function(j){if(!j||!j.ok)throw new Error(j&&j.error||"Erreur");return j;});
}
function flush(){
  if(!SCRIPT_URL||!pending.length)return Promise.resolve();
  var p=pending[0];
  return api("POST",{action:"add",partie:p}).then(function(){
    pending.shift();LS.set("mem_pending",pending);return flush();
  });
}
function load(){
  if(!SCRIPT_URL){setNet("off","Scores sur cet appareil");renderAll();return Promise.resolve();}
  setNet("","Connexion…");
  return flush().then(function(){return api("GET");}).then(function(j){
    rows=j.rows||[];LS.set("mem_cache",rows);online=true;setNet("on","Scores partagés");renderAll();
  }).catch(function(){
    online=false;setNet("off","Hors ligne - scores gardés ici");renderAll();
  });
}
function allRows(){return rows.concat(pending);}
function save(p){
  if(!SCRIPT_URL){rows.push(p);LS.set("mem_cache",rows);renderAll();return Promise.resolve(true);}
  pending.push(p);LS.set("mem_pending",pending);renderAll();
  return load().then(function(){return pending.indexOf(p)<0;});
}

/* ---------- Joueur ---------- */
var player=LS.get("mem_player","");
function same(a,b){return String(a||"").trim().toLowerCase()===String(b||"").trim().toLowerCase();}
function showPlayer(){$("pName").textContent=player||"-";}
function cleanName(s){return String(s||"").replace(/[<>"]/g,"").replace(/\s+/g," ").trim().slice(0,20);}

/* ---------- Niveaux ---------- */
var level=0;
function bestStars(id){
  var b=0;allRows().forEach(function(x){if(x.niveau===id&&same(x.prenom,player))b=Math.max(b,+x.etoiles||0);});return b;
}
function unlocked(){
  // Débloqué : le niveau qui suit le plus haut niveau réussi par ce joueur
  var max=0;
  if(player)allRows().forEach(function(x){
    if(!same(x.prenom,player))return;
    var i=NIVEAUX.findIndex(function(n){return n.id===x.niveau;});
    if(i>=0)max=Math.max(max,i+1);
  });
  return Math.min(max,NIVEAUX.length-1);
}
function starTxt(n){return n?"★★★".slice(0,n)+"☆☆☆".slice(0,3-n):"";}
function renderLevels(){
  var u=unlocked(),h="";
  NIVEAUX.forEach(function(n,i){
    h+='<button class="lvl'+(i===level?" on":"")+'" data-i="'+i+'"'+(i>u?" disabled title=\"Réussis le niveau précédent\"":"")+'>'+
       '<span class="g">'+(i>u?"🔒 ":"")+n.c+"×"+n.r+'</span><span class="s">'+starTxt(bestStars(n.id))+'</span></button>';
  });
  $("levels").innerHTML=h;
}
$("levels").addEventListener("click",function(e){
  var b=e.target.closest(".lvl");if(!b||b.disabled)return;
  level=+b.dataset.i;renderLevels();renderBoard();newGame();
});

/* ---------- Tableau des scores ---------- */
function fmt(t){t=Math.round(+t||0);return Math.floor(t/60)+":"+("0"+t%60).slice(-2);}
function fmtDate(d){var x=new Date(d);return isNaN(x)?"":x.toLocaleDateString("fr-CA",{day:"numeric",month:"short"});}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function cmp(a,b){return (a.essais-b.essais)||(a.temps-b.temps);}
function levelRows(id){return allRows().filter(function(x){return x.niveau===id;}).map(function(x){
  return {prenom:x.prenom,essais:+x.essais,temps:+x.temps,etoiles:+x.etoiles,date:x.date};});}
function renderBoard(){
  var n=NIVEAUX[level],L=levelRows(n.id);
  $("lbTitle").textContent="Records "+n.c+"×"+n.r;
  if(!L.length){
    $("rTries").textContent="-";$("rTriesWho").textContent="";$("rTime").textContent="-";$("rTimeWho").textContent="";
    $("lbTable").innerHTML='<div class="empty">Aucune partie encore. Sois la première!</div>';
  }else{
    var bt=L.slice().sort(cmp)[0],bs=L.slice().sort(function(a,b){return a.temps-b.temps;})[0];
    $("rTries").textContent=bt.essais;$("rTriesWho").textContent=bt.prenom;
    $("rTime").textContent=fmt(bs.temps);$("rTimeWho").textContent=bs.prenom;
    var top=L.slice().sort(cmp).slice(0,5),h='<table><tr><th>#</th><th>Joueur</th><th class="r">Essais</th><th class="r">Temps</th><th class="r">★</th></tr>';
    top.forEach(function(x,i){
      h+='<tr'+(same(x.prenom,player)?' class="me"':'')+'><td>'+(i+1)+'</td><td>'+esc(x.prenom)+'</td><td class="r">'+x.essais+
         '</td><td class="r">'+fmt(x.temps)+'</td><td class="r st">'+"★★★".slice(0,x.etoiles)+'</td></tr>';
    });
    $("lbTable").innerHTML=h+'</table>';
  }
  if(!player){$("myStars").textContent="Joue une partie pour commencer.";return;}
  var tot=0,max=NIVEAUX.length*3;NIVEAUX.forEach(function(x){tot+=bestStars(x.id);});
  $("myStars").innerHTML="<b>"+esc(player)+"</b> : "+tot+" / "+max+" étoiles";
}
function renderAll(){showPlayer();if(level>unlocked())level=unlocked();renderLevels();renderBoard();}

/* ---------- Jeu ---------- */
var deck=[],first=null,lock=false,tries=0,found=0,pairs=0,t0=0,timer=null,elapsed=0,playing=false;
var SUB="₀₁₂₃₄₅₆₇₈₉";
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}

function newGame(){
  clearInterval(timer);timer=null;playing=false;first=null;lock=false;tries=0;found=0;elapsed=0;
  var n=NIVEAUX[level];pairs=n.c*n.r/2;
  var pick=shuffle(IMAGES.slice()).slice(0,pairs);deck=[];
  pick.forEach(function(im,i){
    var h=im[1];
    deck.push({pair:i,name:im[0],html:h});deck.push({pair:i,name:im[0],html:h});
  });
  shuffle(deck);
  var b=$("board");b.innerHTML="";b.style.gridTemplateColumns="repeat("+n.c+",var(--w))";
  deck.forEach(function(d,i){
    var el=document.createElement("button");el.className="card";el.dataset.i=i;el.setAttribute("aria-label","Carte cachée");
    el.innerHTML='<div class="inner"><div class="face cover"><span>?</span></div>'+
      '<div class="face front"><div class="img">'+d.html+'</div><span class="lbl">'+d.name+'</span></div></div>';
    b.appendChild(el);
  });
  layout();updStats();$("hint").textContent="Trouve toutes les paires.";
}
function layout(){
  var n=NIVEAUX[level],b=$("board"),gap=parseFloat(getComputedStyle(b).gap)||10;
  var W=b.parentNode.clientWidth;
  var H=Math.max(260,window.innerHeight-(b.getBoundingClientRect().top+window.scrollY)-24);
  var ratio=1;
  var w=Math.min((W-gap*(n.c-1))/n.c,((H-gap*(n.r-1))/n.r)*ratio,210);
  if(window.innerWidth<700)w=(W-gap*(n.c-1))/n.c; // cellulaire : pleine largeur, on défile
  w=Math.floor(Math.max(w,52));var h=Math.floor(w/ratio);
  b.style.setProperty("--w",w+"px");
  Array.prototype.forEach.call(b.children,function(c){c.style.width=w+"px";c.style.height=h+"px";});
}
var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(layout,120);});

function updStats(){
  $("sTries").textContent=tries;$("sPairs").textContent=found+" / "+pairs;$("sTime").textContent=fmt(elapsed);
}
function tick(){elapsed=(Date.now()-t0)/1000;$("sTime").textContent=fmt(elapsed);}

$("board").addEventListener("click",function(e){
  var el=e.target.closest(".card");if(!el||lock)return;
  if(el.classList.contains("up"))return;
  if(!playing){playing=true;t0=Date.now();timer=setInterval(tick,250);}
  el.classList.add("up");el.setAttribute("aria-label","Carte retournée");
  if(!first){first=el;return;}
  tries++;
  var a=deck[+first.dataset.i],b=deck[+el.dataset.i],f=first;first=null;
  if(a.pair===b.pair){
    f.classList.add("done");el.classList.add("done");found++;updStats();
    if(found===pairs)setTimeout(win,450);
  }else{
    lock=true;updStats();
    setTimeout(function(){f.classList.add("miss");el.classList.add("miss");},380);
    setTimeout(function(){
      f.classList.remove("up","miss");el.classList.remove("up","miss");lock=false;
      f.setAttribute("aria-label","Carte cachée");el.setAttribute("aria-label","Carte cachée");
    },1050);
  }
});

/* ---------- Fin de partie ---------- */
var last=null;
function win(){
  clearInterval(timer);timer=null;tick();playing=false;
  var n=NIVEAUX[level],secs=Math.round(elapsed*10)/10,st=etoiles(tries,pairs);
  var L=levelRows(n.id),bad=[];
  var recT=L.length?Math.min.apply(null,L.map(function(x){return x.essais;})):Infinity;
  var recS=L.length?Math.min.apply(null,L.map(function(x){return x.temps;})):Infinity;
  if(tries<recT)bad.push("🏆 Record d'essais!");
  if(secs<recS)bad.push("⏱ Record de temps!");
  last={date:new Date().toISOString(),prenom:"",niveau:n.id,essais:tries,temps:secs,etoiles:st};
  $("wTitle").textContent=st===3?"Parfait!":st===2?"Bravo!":"Réussi!";
  $("wStars").innerHTML='<span class="on">'+"★".repeat(st)+'</span><span class="off">'+"★".repeat(3-st)+'</span>';
  $("wTries").textContent=tries;$("wTime").textContent=fmt(secs);
  $("wBadges").innerHTML=bad.map(function(b){return '<span class="badge">'+b+'</span>';}).join("");
  $("wNext").hidden=level>=NIVEAUX.length-1;
  $("mWin").classList.add("show");
  if(player){$("wAsk").hidden=true;$("wSave").hidden=true;doSave(player);}
  else{$("wAsk").hidden=false;$("wSave").hidden=false;$("wSaved").textContent="";$("wName").value="";setTimeout(function(){$("wName").focus();},50);}
}
function doSave(name){
  if(!last||last.prenom)return;
  last.prenom=name;
  $("wSaved").textContent="Enregistrement pour "+name+"…";
  save(last).then(function(ok){
    $("wSaved").textContent=ok||!SCRIPT_URL?"✓ Enregistré pour "+name:"Gardé sur cet appareil, envoi à la prochaine connexion.";
    renderAll();
  });
}
$("wSave").addEventListener("click",function(){
  var nm=cleanName($("wName").value);if(!nm){$("wName").focus();return;}
  player=nm;LS.set("mem_player",player);$("wAsk").hidden=true;$("wSave").hidden=true;doSave(nm);
});
$("wName").addEventListener("keydown",function(e){if(e.key==="Enter")$("wSave").click();});
function closeWin(){
  if(last&&!last.prenom){ // partie non enregistrée : on demande avant de fermer
    var nm=cleanName($("wName").value);
    if(nm){player=nm;LS.set("mem_player",player);doSave(nm);}
  }
  $("mWin").classList.remove("show");
}
$("wAgain").addEventListener("click",function(){closeWin();newGame();});
$("wNext").addEventListener("click",function(){
  closeWin();
  if(level<NIVEAUX.length-1)level++;
  if(level>unlocked())level=unlocked();
  renderLevels();renderBoard();newGame();
});

/* ---------- Changer de joueur ---------- */
$("pChange").addEventListener("click",function(){$("nName").value=player;$("mName").classList.add("show");setTimeout(function(){$("nName").select();},50);});
$("nCancel").addEventListener("click",function(){$("mName").classList.remove("show");});
$("nOk").addEventListener("click",function(){
  var nm=cleanName($("nName").value);if(!nm){$("nName").focus();return;}
  player=nm;LS.set("mem_player",player);$("mName").classList.remove("show");level=0;renderAll();newGame();
});
$("nName").addEventListener("keydown",function(e){if(e.key==="Enter")$("nOk").click();if(e.key==="Escape")$("nCancel").click();});

$("bNew").addEventListener("click",newGame);

renderAll();newGame();load();
})();
</script>
